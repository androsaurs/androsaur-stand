<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1165" width="600" height="1165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  :root, svg {
    --bg:#f5f7f9; --ink:#20232a; --muted:#6a707a; --cavity:#e9edf1;
    --base:#c6e0d8; --print:#8cc4b5; --metal:#b7bec7; --servo:#3d6fa8;
    --phone:#3a3e46; --screen:#16181d; --face:#7fe0c4; --axis:#2f7fe0;
  }
  @media (prefers-color-scheme: dark) {
    :root, svg {
      --bg:#1a1c21; --ink:#e6e8ec; --muted:#9aa1ab; --cavity:#24272d;
      --base:#2f4a43; --print:#4f8a7b; --metal:#6c747e; --servo:#5a8fd0;
      --phone:#52565f; --screen:#0b0c0f; --face:#6fd4b6; --axis:#5aa2ff;
    }
  }
  .bg{fill:var(--bg)}
  .base{fill:var(--base);stroke:var(--ink);stroke-width:1.5}
  .print{fill:var(--print);stroke:var(--ink);stroke-width:1.5}
  .printT{fill:var(--print);fill-opacity:.55;stroke:var(--ink);stroke-width:1.5}
  .metal{fill:var(--metal);stroke:var(--ink);stroke-width:1.2}
  .servo{fill:var(--servo);stroke:var(--ink);stroke-width:1.2}
  .phone{fill:var(--phone);stroke:var(--ink);stroke-width:1.2}
  .screen{fill:var(--screen)}
  .face{fill:var(--face)}
  .faceline{stroke:var(--face);stroke-width:3.5;fill:none;stroke-linecap:round}
  .axis{stroke:var(--axis);stroke-width:1.3;stroke-dasharray:8 5;fill:none}
  .arc{stroke:var(--axis);stroke-width:1.5;fill:none}
  .axfill{fill:var(--axis)}
  .axt{fill:var(--axis)}
  .ghost{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3;fill:none}
  .ink{stroke:var(--ink);stroke-width:1.2;fill:none}
  .lead{stroke:var(--muted);stroke-width:1}
  .dot{fill:var(--muted)}
  .t{fill:var(--ink)}
  .tm{fill:var(--muted)}
  .nc{fill:var(--ink)}
  .nt{fill:var(--bg);font-size:13px;font-weight:700}
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
