<!-- legend -->
<g font-size="15" class="t">
  <text x="40" y="928" font-size="17" font-weight="700">Что где</text>
  <text x="40" y="956"><tspan font-weight="700">1</tspan>  Люлька с телефоном</text>
  <text x="40" y="980"><tspan font-weight="700">2</tspan>  Скоба на спине люльки, два уха обнимают серво</text>
  <text x="40" y="1004"><tspan font-weight="700">3</tspan>  Серво лежит длинной стороной назад</text>
  <text x="40" y="1028"><tspan font-weight="700">4</tspan>  Напротив вала ось на подшипнике (не видно)</text>
  <text x="40" y="1052"><tspan font-weight="700">5</tspan>  Шея, серво держится за задние ушки</text>
  <text x="40" y="1076"><tspan font-weight="700">6</tspan>  Поворотный диск</text>
  <text x="40" y="1100"><tspan font-weight="700">7</tspan>  Тумба, внутри всё как было</text>
  <text x="40" y="1130" class="tm" font-size="13">Синий пунктирный круг R 22 мм: внутри только</text>
  <text x="40" y="1148" class="tm" font-size="13">неподвижные детали, люлька всегда снаружи.</text>
</g>
